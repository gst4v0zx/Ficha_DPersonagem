<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ficha do Personagem</h1>
        <section>
            
            <div>
                <h2>Nome Personagem</h2>
                <input type="text">
            </div>
            <div>
                <h2>Nome Jogador</h2>
                <input type="text">
            </div>
            <div>
                <h2>Pontos XP</h2>
                <input type="number">
            </div>
            <div>
                <h2>Raça</h2>
                <input type="text">
            </div>
            <div>
                <h2>Classe</h2>
                <input type="text">
            </div>
            
            <div>
                <h2>Alinhamneto</h2>
                <input type="text">
            </div>

        </section>
    
    </header>
    <main>
        <section>
            <div>
                <div>
                    <h2>FOR</h2>
                    <input type="text">
                </div>
                <div>
                    <h2>DES</h2>
                    <input type="text">
                </div>
                <div>
                    <h2>INT</h2>
                    <input type="text">
                </div>
                <div>
                    <h2>CON</h2>
                    <input type="text">
                </div>
                <div>
                    <h2>SAB</h2>
                    <input type="text">
                </div>
                <div>
                    <h2>CAR</h2>
                    <input type="text">
                </div>               
            </div>
            <div>
                <div>
                    <div>
                        <h2>Vida</h2>
                        <input type="text">
                    </div>
                    <div>
                        <h2>Defesa</h2>
                        <input type="text">
                    </div>
                    <div>
                        <h2>Velocidade</h2>
                        <input type="text">
                    </div>
                
                </div>

            <div>
                <h2>Biografia</h2>
                <textarea name="" id="" cols="30" rows="25">
                </textarea>
            </div>

        </section>
        <section>
            <div>
                <h2>Equipamentos</h2>
                <textarea name="" id="" cols="40" rows="10">
                </textarea>
            </div>
            <div>
                <h2>caracteristicas</h2>
                <textarea name="" id="" cols="40" rows="10">
                </textarea>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p>Meu 
                <a href="https://github.com/gst4v0zx">GitHub</a>
                <img src="download.png" alt="" width="20px">
            </p>
            
            
        </div>
    </footer>

</body>
</html>
