<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <section class="conteiner-topo">
            <div class="conteiner-nome-personagem">
                <p>Nome Personagem</p>
                <input type="text">
            </div>
            <div class="conteiner-nome-jogador">
                <p>Nome Jogador</p>
                <input type="text">
            </div>
            <div class="conteiner-pontos-xp">
                <p>Pontos de Experiência</p>
                <input type="text">
            </div>
            <div class="conteiner-raca">
                <p>Raça</p>
                <input type="text">
            </div>
            <div class="conteiner-classe">
                <p>Classe</p>
                <input type="text">
            </div>
            <div class="conteiner-alinhamento">
                <p>Alinhamento</p>
                <input type="text">
            </div>
        </section>
    </header>
    <main class="conteudoprincipal">
        <section class="sessaoconteudoprincipal">
            <div class="containermodificadores">
                <div class="forca">
                    <p>FOR</p>
                    <input type="text">
                </div>
                <div class ="destreza">
                    <p>DES</p>
                    <input type="text">
                </div>
                <div class="constituicao">
                    <p>CON</p>
                    <input type="text">
                </div>
                <div class="inteligencia">
                    <p>INT</p>
                    <input type="text">
                </div>
                <div classs="sabedoria">
                    <p>SAB</p>
                    <input type="text">
                </div>
                <div class="carisma">
                    <p>CAR</p>
                    <input type="text">
                </div>
            </div>
            <div class="vdvimg">
                <div class="vdv">
                    <div>
                        <p>Vida</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Defesa</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Velocidade</p>
                        <input type="text">
                    </div>
                </div>
                <div class="containerimg">
                    <img src="" alt="">
                </div>
            </div>
            <div class="containerbiografia">
                <h2>Bibliografia</h2>
                <textarea name="" id="" cols="30" rows="25"></textarea>
            </div>
        </section>
        <section class="conteudosecundario">
            <div class="containerequipamentos">
                <h2>Equipamentos</h2>
                <textarea name="" id="" cols="30" rows="10"></textarea>
            </div>
            <div class="containercaracteristicas">
                <h2>Características</h2>
                <textarea name="" id="" cols="30" rows="10"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p>
                🚀
                Acesse o meu Perfil do GitHub:
                <a href="https://github.com/gst4v0zx">gst4v0zx</a>
                🚀
            </p>
        </div>
    </footer>
</body>
</html>
