<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
        
        <section class="containertop">
            
            <div class="containernamecharacter">
                <p>Nome Personagem</p>
                <input type="text">
            </div>
            <div class="containernameplayer">
                <p>Nome Jogador</p>
                <input type="text">
            </div>
            <div class="containerxp">
                <p>Pontos XP</p>
                <input type="number">
            </div>
            <div class="raça">
                <p>Raça</p>
                <input type="text">
            </div>
            <div class="containerclass">
                <p>Classe</p>
                <input type="text">
            </div>
            
            <div class="containeralinhamento">
                <p>Alinhamento</p>
                <input type="text">
            </div>

        </section>
    
    </header>
    <main>
        <section>
            <div>
                <div>
                    <p>FOR</p>
                    <input type="text">
                </div>
                <div>
                    <p>DES</p>
                    <input type="text">
                </div>
                <div>
                    <p>INT</p>
                    <input type="text">
                </div>
                <div>
                    <p>CON</p>
                    <input type="text">
                </div>
                <div>
                    <p>SAB</p>
                    <input type="text">
                </div>
                <div>
                    <p>CAR</p>
                    <input type="text">
                </div>               
            </div>
            <div>
                <div>
                    <div>
                        <h2>Vida</h2>
                        <input type="text">
                    </div>
                    <div>
                        <h2>Defesa</h2>
                        <input type="text">
                    </div>
                    <div>
                        <h2>Velocidade</h2>
                        <input type="text">
                    </div>
                
                </div>

            <div>
                <h2>Biografia</h2>
                <textarea name="" id="" cols="30" rows="25">
                </textarea>
            </div>

        </section>
        <section>
            <div>
                <h2>Equipamentos</h2>
                <textarea name="" id="" cols="40" rows="10">
                </textarea>
            </div>
            <div>
                <h2>caracteristicas</h2>
                <textarea name="" id="" cols="40" rows="10">
                </textarea>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p>Meu 
                <a href="https://github.com/gst4v0zx">GitHub</a>
                <img src="download.png" alt="" width="20px">
            </p>
            
            
        </div>
    </footer>

</body>
</html>
